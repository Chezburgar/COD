name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/fps-5v5-team-deathmatch-qfkko2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.state.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TURN relay credentials, so players behind a symmetric NAT can connect
      # at all. Set TURN_KEY as a repository secret to switch relays on; with
      # the secret unset the build simply falls back to STUN.
      - run: npm run build
        env:
          VITE_TURN_KEY: ${{ secrets.TURN_KEY }}

      # Pages can be off, served from a branch, or served from a workflow, and
      # this job has something different to do in each case. Ask first rather
      # than assuming — deploying into a branch-served site just fails.
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh prints the 404 body on stdout, so capture and then validate
          # rather than trusting whatever came back.
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null) || build_type=""
          case "$build_type" in
            workflow|legacy) ;;
            *) build_type=none ;;
          esac
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "Pages build type: $build_type"

      - if: steps.state.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5
      - if: steps.state.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - if: steps.state.outputs.build_type == 'legacy'
        run: |
          echo "::notice title=Served from a branch::Pages is publishing ${GITHUB_REF_NAME}/docs directly."
          echo "The freshly built site is committed there, so this push is already live."
          echo "Switch Settings -> Pages to source 'GitHub Actions' if you would rather this workflow published it."

      - if: steps.state.outputs.build_type == 'none'
        run: |
          echo "::notice title=GitHub Pages is not enabled::The site built fine but there is nowhere to publish it yet."
          echo "Enable it once under Settings -> Pages, either way:"
          echo "  * Deploy from a branch -> branch ${GITHUB_REF_NAME}, folder /docs"
          echo "    (the built site is committed there, so it goes live immediately)"
          echo "  * GitHub Actions - this workflow then publishes on every push."

  deploy:
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
